services:
  mysql:
    image: mysql:8.0
    container_name: applicant-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: applicant_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always

  app:
    build: .
    container_name: applicant-app
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: applicant_db
      DB_USERNAME: root
      DB_PASSWORD: root1234
    restart: always

volumes:
  mysql_data: